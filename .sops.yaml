# Groups
groups:

  compute: &compute
    - *admin
    - *host_andromeda
    - *host_bode
    - *host_centaurus

  sbc: &sbc
    - *admin
    - *host_alluvium
    - *host_basidium
    - *host_colluvium

creation_rules:

  # Per Host Secrets
  - path_regex: ^hosts[\\/]edge[\\/]ionos-de[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_ionos_de

  - path_regex: ^hosts[\\/]virtual[\\/]pcb[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_pcb

  - path_regex: ^hosts[\\/]virtual[\\/]mcp[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_mcp

  - path_regex: ^hosts[\\/]virtual[\\/]auth[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_auth

  # Shared Secrets

  - path_regex: ^secrets[\\/]compute\.yaml$
    key_groups:
      - age: *compute

  - path_regex: ^secrets[\\/]sbc\.yaml$
    key_groups:
      - age: *sbc

  - path_regex: ^secrets[\\/]paperless\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_paperless
        - *host_mcp

  - path_regex: ^secrets[\\/]sso\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_auth
        - *host_ionos_de