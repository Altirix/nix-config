# Groups
groups:
  common: &common
    - *admin
    - *host_andromeda
    - *host_bode
    - *host_centaurus
    - *host_ionos_de
    - *host_alluvium
    - *host_basidium
    - *host_dls
    - *host_mcp

  compute: &compute
    - *admin
    - *host_andromeda
    - *host_bode
    - *host_centaurus

  edge: &edge
    - *admin
    - *host_ionos_de

  printer: &printer
    - *admin
    - *host_alluvium
    - *host_basidium

  virtual: &virtual
    - *admin
    - *host_dls
    - *host_mcp

creation_rules:

  # Per Host Secrets
  - path_regex: ^hosts[\\/]compute[\\/]andromeda[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_andromeda

  - path_regex: ^hosts[\\/]compute[\\/]bode[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_bode

  - path_regex: ^hosts[\\/]compute[\\/]centaurus[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_centaurus

  - path_regex: ^hosts[\\/]edge[\\/]ionos-de[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_ionos_de

  - path_regex: ^hosts[\\/]virtual[\\/]mcp[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_mcp

  # Shared Secrets
  - path_regex: ^secrets[\\/]common\.yaml$
    key_groups:
      - age: *common

  - path_regex: ^secrets[\\/]compute\.yaml$
    key_groups:
      - age: *compute

  - path_regex: ^secrets[\\/]edge\.yaml$
    key_groups:
      - age: *edge

  - path_regex: ^secrets[\\/]printer\.yaml$
    key_groups:
      - age: *printer

  - path_regex: ^secrets[\\/]standalone\.yaml$
    key_groups:
      - age:
        - *admin

  - path_regex: ^secrets[\\/]storage\.yaml$
    key_groups:
      - age:
        - *admin

  - path_regex: ^secrets[\\/]virtual\.yaml$
    key_groups:
      - age: *virtual