keys:

# User Keys

  - &admin age1hzd4wek48s4mpptw00l30uhgpmcm4atuhjnqtxttftnhp8xflgnqxzdhmz # Main PC

# Host Keys

  - &host_andromeda age18wc67zrkjh7n4xe7c2j5pe60yyhqgwrx5jvwnw3jkq74c84r9drsth2stg # Incus Node 1
  - &host_bode age1t648rtjxt9wpsvzmrtvxlj9cfqajh2sll5u5uxqrnzxy0ffun5qqu6wfh2 # Incus Node 2
  - &host_centaurus age1qfnlgqukf2cvkrl6yzfufwn4nlhrrrt0rvtah6rp9r880r9sq3ksm7llup # Incus Node 3

# Groups
groups:
  common: &common
    - *admin
    - *host_andromeda
    - *host_bode
    - *host_centaurus

  compute: &compute
    - *admin
    - *host_andromeda
    - *host_bode
    - *host_centaurus

creation_rules:

  # Per Host Secrets
  - path_regex: ^hosts[\\/]compute[\\/]andromeda[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_andromeda

  - path_regex: ^hosts[\\/]compute[\\/]bode[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_bode

  - path_regex: ^hosts[\\/]compute[\\/]centaurus[\\/]secrets\.yaml$
    key_groups:
      - age:
        - *admin
        - *host_centaurus

  # Shared Secrets
  - path_regex: ^secrets[\\/]common\.yaml$
    key_groups:
      - age: *common

  - path_regex: ^secrets[\\/]compute\.yaml$
    key_groups:
      - age: *compute

  - path_regex: ^secrets[\\/]edge\.yaml$
    key_groups:
      - age:
        - *admin

  - path_regex: ^secrets[\\/]standalone\.yaml$
    key_groups:
      - age:
        - *admin

  - path_regex: ^secrets[\\/]storage\.yaml$
    key_groups:
      - age:
        - *admin

  - path_regex: ^secrets[\\/]virtual\.yaml$
    key_groups:
      - age:
        - *admin