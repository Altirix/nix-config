# Seeds /var/lib/moonraker/config/printer.cfg on first start, edit that copy from Mainsail after.
# Board and kinematics examples: https://github.com/Klipper3d/klipper/tree/master/config

[include mainsail.cfg]

[mcu]
# ls /dev/serial/by-id/
serial: /dev/serial/by-id/usb-Klipper_CHANGEME

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
