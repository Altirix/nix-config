# What Mainsail expects from Klipper. Managed by NixOS, override macros in printer.cfg.

[virtual_sdcard]
path: @gcodes@
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[respond]

[exclude_object]

[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z2 F600
    G90
  {% endif %}
  M106 S0
  CLEAR_PAUSE
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 E-1 F2100
    G1 Z2 F600
    G90
  {% endif %}

[gcode_macro RESUME]
description: Resume the paused print
rename_existing: RESUME_BASE
gcode:
  {% if printer.extruder is defined and printer.extruder.can_extrude %}
    G91
    G1 E1 F2100
    G90
  {% endif %}
  RESUME_BASE
