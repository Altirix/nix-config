# A site with oauth: the subrequest oauth-check.conf makes, and its 401 pointing clients at the RFC 9728 metadata
# of the location they asked (each has its own, written by the module) to find the authorization server.

# Only the bearer token counts, a browser's cookies never stand in for it.
location = /_oauth {
    internal;
    proxy_pass @proxy@/oauth2/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie "";
}

location @oauth_challenge {
    add_header WWW-Authenticate 'Bearer resource_metadata="https://@domain@/.well-known/oauth-protected-resource$oauth_resource", scope="@scopes@"' always;
    return 401;
}
