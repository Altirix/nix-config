# Every `locations` prefix: proxied unbuffered with long timeouts so streams pass straight through (uploads
# too), and redirects to the upstream's path pointed back under the prefix. A site with oauth has
# oauth-check.conf in front of this.
proxy_set_header Connection "";
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
proxy_redirect http://$host@path@ @prefix@;
proxy_redirect https://$host@path@ @prefix@;
proxy_redirect @path@ @prefix@;
