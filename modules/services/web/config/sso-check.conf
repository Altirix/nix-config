# No session, no upstream: the browser is sent to sign in (@sso_login) and comes back here after. The upstream gets
# the user's name, a refreshed session cookie goes back to the browser.
auth_request /oauth2/auth;
error_page 401 = @sso_login;
auth_request_set $web_user $upstream_http_x_auth_request_preferred_username;
auth_request_set $sso_cookie $upstream_http_set_cookie;
add_header Set-Cookie $sso_cookie;
proxy_set_header X-Forwarded-User $web_user;
