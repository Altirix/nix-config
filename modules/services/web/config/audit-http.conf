# Sites with audit: the start of each response, kept by audit.js for the log line.
js_import audit from @script@;
js_var $audit_response;
log_format audit escape=json '{"time":"$time_iso8601","client":"$remote_addr","user":"$web_user","host":"$host",'
    '"request":"$request","status":$status,"request_length":$request_length,"request_body":"$request_body",'
    '"bytes_sent":$body_bytes_sent,"response":"$audit_response","duration":$request_time}';
