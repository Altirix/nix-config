# Sites with audit: the request and the start of the response, as audit.js keeps them, logged where $audit_on.
js_import audit from @script@;
js_var $audit_on;
js_var $audit_raw;
js_set $audit_request audit.request;
js_set $audit_response audit.response;
log_format audit escape=json '{"time":"$time_iso8601","client":"$remote_addr","user":"$web_user","host":"$host",'
    '"request":"$request","status":$status,"request_length":$request_length,"request_body":"$audit_request",'
    '"bytes_sent":$body_bytes_sent,"response":"$audit_response","duration":$request_time}';
