# A site with sso: oauth2-proxy's own pages (sign in, the callback, sign out), the check sso-check.conf makes,
# and where a browser without a session is sent. Sessions are this site's alone (host-only cookie).
location /oauth2/ {
    proxy_pass @proxy@;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Only the session cookie counts, a bearer token (an MCP client's) never stands in for it.
location = /oauth2/auth {
    internal;
    proxy_pass @proxy@/oauth2/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location @sso_login {
    return 302 /oauth2/start?rd=$request_uri;
}
