# No valid access token, no upstream: 401 with where to get one (@oauth_challenge), and the upstream never
# sees the token. oauth2-proxy (/_oauth) names the user for the access log.
set $oauth_resource @prefix@;
auth_request /_oauth;
auth_request_set $web_user $upstream_http_x_auth_request_user;
error_page 401 = @oauth_challenge;
proxy_set_header Authorization "";
