# A `locations` prefix of a site with audit: its requests (buffered whole, kept in memory up to 32k so
# $request_body has them) and the start of its responses go to the audit log as well. Responses come
# uncompressed, so the log reads them.
client_body_buffer_size 32k;
proxy_set_header Accept-Encoding "";
js_body_filter audit.collect buffer_type=string;
access_log @log@ audit;
