# REA's only way in: /<project>/mcp to the gateway, /<project>/samples/ takes uploads, /<project>/shared/ serves
# what sessions share. Only the projects listed in the locations answer, anything else is a 404.
server {
    listen 0.0.0.0:@port@;
    listen [::]:@port@;
    client_max_body_size 1g;

    location ~ ^/(@projects@)/mcp$ {
        proxy_pass http://127.0.0.1:@gatewayPort@;
        # Streams pass straight through, sessions stay open while an agent works.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # PUT stores a sample, GET lists or fetches, DELETE removes. One level, no subdirectories.
    location ~ ^/(?<project>@projects@)/samples/(?<file>[^/]*)$ {
        alias /var/lib/rea/$project/samples/$file;
        dav_methods PUT DELETE;
        dav_access group:r all:r;
        autoindex on;
        limit_except GET PUT DELETE { deny all; }
    }

    location ~ ^/(?<project>@projects@)/shared/(?<file>.*)$ {
        alias /var/lib/rea/$project/shared/$file;
        autoindex on;
        limit_except GET { deny all; }
    }

    location / {
        return 404;
    }
}
